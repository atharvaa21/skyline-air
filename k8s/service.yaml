# Service = a stable address in front of the pods.
# type NodePort exposes it on a fixed port of the Minikube node.
apiVersion: v1
kind: Service
metadata:
  name: skyline-air-service
  labels:
    app: skyline-air
spec:
  type: NodePort
  selector:
    app: skyline-air       # send traffic to pods with this label
  ports:
    - port: 80             # port of the Service inside the cluster
      targetPort: 80       # port of the container
      nodePort: 30080      # port opened on the Minikube node (30000-32767)
