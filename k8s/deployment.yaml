# Deployment = "keep N copies (pods) of my app running, and replace them
# gradually when I ship a new image".
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skyline-air
  labels:
    app: skyline-air
spec:
  replicas: 2                      # run 2 identical pods
  strategy:
    type: RollingUpdate            # replace pods gradually on every new image
    rollingUpdate:
      maxSurge: 1                  # start 1 extra new pod first...
      maxUnavailable: 0            # ...and only remove an old pod once the new one is ready
  selector:
    matchLabels:
      app: skyline-air             # this Deployment manages pods with this label
  template:
    metadata:
      labels:
        app: skyline-air
    spec:
      imagePullSecrets:        # login that lets Kubernetes pull from the private ECR repo
        - name: ecr-secret   # (created by the Jenkins pipeline on every run)
      containers:
        - name: skyline-air
          # Jenkins replaces IMAGE_PLACEHOLDER with <account>.dkr.ecr.<region>.amazonaws.com/skyline-air:v<build number>
          image: IMAGE_PLACEHOLDER
          # Every build has a unique tag (v1, v2, ...), so IfNotPresent is safe. It also means the
          # pods still start after a server restart, even when the 12-hour ECR login has expired.
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:          # pod only receives traffic once this succeeds
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
